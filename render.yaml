# Render Blueprint: https://render.com/docs/blueprint-spec
# New → Blueprint → pick this repo. Render asks for the values marked `sync: false`.
services:
  - type: web
    name: veya
    runtime: node
    plan: starter # a persistent disk (for the SQLite database) needs a paid instance
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/config
    disk:
      name: veya-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DB_FILE
        value: /var/data/veya.db
      - key: ADMIN_TOKEN
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
